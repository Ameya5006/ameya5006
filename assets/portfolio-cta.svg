  <path d="M10 83v-72h762M28 103h760V30" fill="none" stroke="#071216" stroke-opacity=".35"/>
  <text x="30" y="38" font-size="32" font-weight="600" letter-spacing="2">EXPLORE MY</text>
  <text x="28" y="83" font-size="39" font-weight="800" letter-spacing="-1">INTERACTIVE PORTFOLIO</text>
  <path d="M688 24h78v66h-78z" fill="#0a1b20"/>
  <path class="arrow" d="M703 57h45m-15-16 16 16-16 16" fill="none" stroke="#47e7f2" stroke-width="4"/>
</svg>
