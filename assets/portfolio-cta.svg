  <text x="30" y="29" font-size="14" font-weight="400">Explore my</text>
  <text x="30" y="61" font-size="28" font-weight="600">Interactive portfolio</text>
  <path d="M688 19h78v50h-78z" fill="#0a1b20"/>
  <path class="arrow" d="M703 44h45m-15-14 16 14-16 14" fill="none" stroke="#47e7f2" stroke-width="3"/>
</svg>
