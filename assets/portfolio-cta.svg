<svg xmlns="http://www.w3.org/2000/svg" width="800" height="88" viewBox="0 0 800 88" role="img" aria-labelledby="title desc">
  <title id="title">Explore my interactive portfolio</title>
  <desc id="desc">A bordered portfolio button with a gently moving arrow. ameya5006.github.io.</desc>
  <defs><style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#071216}
    .arrow{animation:nudge 4s ease-in-out infinite}
    @keyframes nudge{50%{transform:translateX(7px)}}
    @media(prefers-reduced-motion:reduce){.arrow{animation:none}}
  </style></defs>
