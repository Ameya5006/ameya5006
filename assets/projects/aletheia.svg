  <title id="title">Aletheia — Developer / research workbench</title>
  <desc id="desc">An auditable readmission research workbench. FastAPI, React, PostgreSQL, scikit-learn and MLflow. Calibrated inference and hash-linked audit records. Educational research, noncausal explanations. Repository: github.com/Ameya5006/Aletheia.</desc>
