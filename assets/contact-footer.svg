<svg xmlns="http://www.w3.org/2000/svg" width="800" height="68" viewBox="0 0 800 68" role="img" aria-labelledby="title desc">
  <title id="title">Let’s talk — Ameya Agarwal</title>
  <desc id="desc">The next build starts with a conversation. A cyan signal moves gently along the footer.</desc>
  <defs><style>
    .signal{stroke-dasharray:12 175;animation:travel 12s linear infinite}
    @keyframes travel{to{stroke-dashoffset:-374}}
    @media(prefers-reduced-motion:reduce){.signal{animation:none}}
  </style></defs>
  <rect width="800" height="68" rx="8" fill="#0d1318"/>
  <path d="M24 20h340l10-7 10 14 10-7h382" fill="none" stroke="#30434b" stroke-width="2"/>
  <path class="signal" d="M24 20h340l10-7 10 14 10-7h382" fill="none" stroke="#47e7f2" stroke-width="2"/>
  <text x="24" y="49" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#f0f5f7">Let’s talk</text>
  <text x="420" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#c3d3d9">The next build starts with a conversation.</text>
  <rect x="766" y="42" width="8" height="8" fill="#ff6a61"/>
</svg>
